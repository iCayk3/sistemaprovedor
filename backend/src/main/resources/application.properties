spring.application.name=controle-instalacao
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:controle?_instalacao}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:#Rr66oi90}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-stacktrace=never
server.address=0.0.0.0
server.port=8080
api.security.token.secret=${JWT_SECRET}
api.service.integration.rbx=${LINK_RBX}
api.service.integration.rbx.v2=${LINK_RBX_V2:}
api.service.integration.rbx.atendimentos.escrita-habilitada=${RBX_ATENDIMENTOS_ESCRITA_HABILITADA:false}
api.service.integration.frontend=${API_FRONTEND:http://localhost:5173}
api.service.integration.rbx.chave=${API_KEY}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
ia.provider=${IA_PROVIDER:gemini}
ia.openai.api-key=${OPENAI_API_KEY:}
ia.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ia.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ia.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
ia.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:4096}
