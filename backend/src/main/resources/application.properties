spring.application.name=controle-instalacao
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:controle_instalacao}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Performance Tuning
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Server Performance & Compression
server.error.include-stacktrace=never
server.address=0.0.0.0
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Caffeine In-Memory Cache (TTL 5 minutes)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m


api.security.token.secret=${JWT_SECRET}
api.security.cookie.secure=${COOKIE_SECURE:#{null}}
api.security.rbx.secret=${RBX_ENCRYPTION_KEY:${JWT_SECRET}}
api.service.integration.rbx=${LINK_RBX}
api.service.integration.rbx.v2=${LINK_RBX_V2:}
api.service.integration.rbx.atendimentos.escrita-habilitada=${RBX_ATENDIMENTOS_ESCRITA_HABILITADA:false}
api.service.integration.frontend=${API_FRONTEND:http://localhost:5173}
api.service.integration.rbx.chave=${API_KEY}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
ia.provider=${IA_PROVIDER:gemini}
ia.openai.api-key=${OPENAI_API_KEY:}
ia.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ia.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ia.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
ia.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:4096}
